# Local development MongoDB only. The application itself runs using dotnet.
services:
  mongo:
    image: mongo:8.0.15
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - kinsmen_mongo:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status(); quit(db.hello().isWritablePrimary ? 0 : 1); } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}); quit(1); }"
      interval: 3s
      timeout: 5s
      retries: 30
volumes:
  kinsmen_mongo:
